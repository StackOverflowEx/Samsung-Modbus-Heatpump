name: Heatpump
devices:
  # ==========================================
  # OUTDOOR UNIT (EHS Mono HT Quiet)
  # ==========================================
  - name: EHS Mono HT Quiet
    model: AE080CXYDEK/EU
    capacity: 8
    capacity_unit: kW
    bindMessageIdRegisterOffset: 6000
    readMessageIdRegisterOffset: 4
    registers:
      # --- Fixed Outdoor Registers ---
      - name: Modbus Module Error Status
        address: 0
        platform: binary_sensor
        masks:
          - name: Address Error
            mask: 1
          - name: Communication Error on R1/R2
            mask: 2
          - name: Tracking Error
            mask: 4
          - name: Any
            mask: 0x7
      - name: Outdoor Unit Error Code
        address: 1
        mapping:
          0: No Error
          fallback: "Error {value}"
      - name: Defrost Operation
        platform: binary_sensor
        address: 2
        mapping:
          0: "Off"
          255: "Off"
          fallback: "On"

      # --- Custom Outdoor Registers ---
      - name: Operation Mode
        messageId: 0x8001
        mapping:
          0: Stop
          1: Safety
          2: Normal
          3: Balance
          4: Recovery
          5: Defrost
          6: Comp Down
          12: Pump Down
          13: Pump Out
          fallback: "Mode {value}"
      - name: Operation Status
        messageId: 0x8003
        mapping:
          0: Undefined
          1: Cool
          2: Heat
          3: Cool Main
          4: Heat Main
      - name: Compressor Status
        platform: binary_sensor
        messageId: 0x8010
      - name: Defrost Status
        messageId: 0x8061
        mapping:
          0: Clear
          1: Step 1
          2: Step 2
          3: Step 3
          7: End
          255: No Defrost
          fallback: "Unknown {value}"
      - name: Backup Operation Status
        platform: binary_sensor
        messageId: 0x80A5
      - name: Comp Protection Control Status
        platform: binary_sensor
        messageId: 0x80A6
      - name: Base Heater Status
        platform: binary_sensor
        messageId: 0x80AF
      - name: PHE Heater Status
        platform: binary_sensor
        messageId: 0x80D7
      - name: Waterout Type
        messageId: 0x80D8
        mapping:
          0: Default
          1: 70°C
      - name: Outdoor Temperature
        messageId: 0x8204
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        signed: true
        state_class: measurement
      #Multiply by 0.1 to get kgf/cm2, multiply by this value to get bar
      - name: High Pressure
        messageId: 0x8206
        scale: 0.098
        unit_of_measurement: "bar"
        device_class: pressure
        state_class: measurement
      - name: Low Pressure
        messageId: 0x8208
        scale: 0.098
        unit_of_measurement: "bar"
        device_class: pressure
        state_class: measurement
      - name: Comp Discharge Temperature
        messageId: 0x820A
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        signed: true
        state_class: measurement
      - name: Compressor Current
        messageId: 0x8217
        scale: 0.1
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
      - name: Condenser Out Temperature
        messageId: 0x8218
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        signed: true
        state_class: measurement
      - name: Suction Temperature
        messageId: 0x821A
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        signed: true
        state_class: measurement
      - name: Fan Speed Step Setting
        messageId: 0x8226
        state_class: measurement
      - name: Main EEV Opening
        messageId: 0x8229
        state_class: measurement
      - name: Order Frequency
        messageId: 0x8236
        unit_of_measurement: "Hz"
        device_class: frequency
        state_class: measurement
      - name: Target Frequency
        messageId: 0x8237
        unit_of_measurement: "Hz"
        device_class: frequency
        state_class: measurement
      - name: Current Frequency
        messageId: 0x8238
        unit_of_measurement: "Hz"
        device_class: frequency
        state_class: measurement
      - name: Sat Temp High Pressure
        messageId: 0x829F
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        signed: true
        state_class: measurement
      - name: Sat Temp Low Pressure
        messageId: 0x82A0
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        signed: true
        state_class: measurement
      - name: Evaporator In Temperature
        messageId: 0x82DE
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        signed: true
        state_class: measurement
      - name: Water In Temperature
        messageId: 0x82DF
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        signed: true
        state_class: measurement
      - name: Water Out Temperature
        messageId: 0x82E0
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        signed: true
        state_class: measurement

  # ==========================================
  # INDOOR UNIT (Tank Integrated Hydro)
  # ==========================================
  - name: Tank Integrated Hydro Unit
    model: AE200RNWMEG/EU
    capacity: 200
    capacity_unit: l
    bindMessageIdRegisterOffset: 7000
    readMessageIdRegisterOffset: 82
    registers:
      # --- Fixed Indoor Registers ---
      - name: Communication Status
        address: 50
        platform: binary_sensor
        masks:
          - name: Address Exists
            mask: 1
          - name: Type OK
            mask: 2
          - name: Device Ready
            mask: 4
          - name: Communication Error
            mask: 8
      - name: Heating On/Off
        address: 52
        platform: switch
      - name: Indoor Unit Error Code
        address: 63
        mapping:
          0: No Error
          fallback: "Error {value}"
      - name: Water-in Temperature
        address: 65
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        signed: true
        state_class: measurement
      - name: Water-out Temperature
        address: 66
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        signed: true
        state_class: measurement
      - name: Water-out Set Temperature
        platform: number
        mode: box
        address: 68
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        signed: true
        min: 15
        max: 65
        step: 0.5
      - name: DHW Operation
        platform: switch
        address: 72
      - name: DHW Mode
        platform: select
        address: 73
        mapping:
          0: Eco
          1: Standard
          2: Power
          3: Force
      - name: DHW Set Temperature
        platform: number
        mode: box
        address: 74
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        signed: true
        min: 30
        max: 65
        step: 0.5
      - name: DHW Temperature
        address: 75
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        signed: true
        state_class: measurement
      - name: Quiet Mode
        platform: switch
        address: 78
      - name: Outing Mode
        platform: switch
        address: 79

      # --- Custom Indoor Registers ---
      - name: Heat Demand
        platform: binary_sensor
        messageId: 0x4028
      - name: Defrost Status Indoor
        messageId: 0x402E
        mapping:
          0: Clear
          1: Initialise
          2: Run
      - name: 3-Way Valve Status
        messageId: 0x4067
        mapping:
          0: Room
          1: Tank
      - name: Backup Heater Status
        messageId: 0x406C
        mapping:
          0: "Off"
          1: "Step 1"
          2: "Step 2"
      - name: Booster Heater Status
        platform: binary_sensor
        messageId: 0x4087
      - name: Water Pump Status
        platform: binary_sensor
        messageId: 0x4089
      - name: Pump Status
        messageId: 0x408A
        platform: binary_sensor
        masks:
          # Valve outputs B10 and B14 are active when their bits are clear.
          - name: Zone 1
            mask: 0b01
            invert: true
      - name: Inverter Pump Speed
        messageId: 0x40C4
        unit_of_measurement: "%"
        state_class: measurement
      - name: DHW Thermostat Status
        platform: binary_sensor
        messageId: 0x40C5
      - name: Water-out Offset
        messageId: 0x4248
        scale: 0.1
        signed: true
        unit_of_measurement: "°C"
        platform: number
        mode: box
        min: -5
        max: 5
        step: 0.5
      - name: Calculated Water Law Set Temp
        messageId: 0x427F
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        signed: true
        state_class: measurement
      - name: Water Out Zone 1
        messageId: 0x42d8
        scale: 0.1
        unit_of_measurement: "°C"
        device_class: temperature
        signed: true
        state_class: measurement
      - name: Water Flow
        messageId: 0x42E9
        scale: 0.1
        unit_of_measurement: "l/min"
        state_class: measurement
      - name: Frequency Response Control
        messageId: 0x42F1
        masks:
          - name: Enabled
            platform: switch
            mask: 0xFF00
          - name: Frequency Ratio
            platform: number
            mask: 0x00FF
            min: 50
            max: 150
            step: 1
            unit_of_measurement: "%"
            mode: box
